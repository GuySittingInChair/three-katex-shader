<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>aiship · learn math visually</title>
    <meta
      name="description"
      content="Animated equations where every symbol is explained. Watch the math, read it, change it and share what you make."
    />
    <meta property="og:title" content="aiship · learn math visually" />
    <meta
      property="og:description"
      content="Animated equations where every symbol is explained. Watch the math, read it, change it and share what you make."
    />
    <meta property="og:image" content="https://aiship.lol/thumbs/hopfFibration.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="viewer">
    <div id="canvas-container"></div>

    <!-- Landing page (/) -->
    <main id="landing" class="landing" hidden>
      <section class="hero hero-min">
        <div class="hero-inner">
          <h1 class="hero-brand"><span class="brand-mark">aiship</span></h1>
          <div class="hero-actions">
            <button class="btn btn-ghost" type="button" data-role="log-in">Log in</button>
            <button class="btn btn-primary" type="button" data-role="create-account">Create account</button>
            <a class="btn btn-primary hidden" data-role="my-profile" data-link href="/">Your profile</a>
            <a class="btn btn-ghost" data-link href="/sketches">Browse sketches</a>
          </div>
        </div>
      </section>
    </main>

    <!-- All sketches (/sketches) -->
    <main id="sketches-page" class="landing sketches-page" hidden>
      <div class="page-inner">
        <header class="page-head">
          <a class="brand" href="/" data-link>aiship</a>
          <button class="bar-btn account-btn" type="button" data-role="page-account">Log in</button>
        </header>
        <h1 class="page-title">Sketches</h1>
        <div id="landing-grid"></div>
        <footer class="page-foot">
          <a href="/privacy.html">Privacy</a>
          <a href="https://github.com/GuySittingInChair/three-katex-shader" target="_blank" rel="noopener">GitHub</a>
        </footer>
      </div>
    </main>

    <!-- Profile (/u/<username>) -->
    <main id="profile" class="landing profile-page" hidden></main>

    <!-- Viewer (/s/<id>) -->
    <header class="topbar" id="topbar">
      <a class="brand" href="/" data-link>aiship</a>
      <button class="sketch-title" id="sketch-title" type="button" aria-label="Choose a sketch">
        <span class="sketch-title-name"></span>
        <span class="sketch-title-meta"></span>
      </button>
      <a class="topbar-author" id="topbar-author" href="/" data-link></a>
      <div class="topbar-right">
        <button id="review-toggle" class="bar-btn hidden" type="button">Review</button>
        <button id="account-toggle" class="bar-btn account-btn" type="button">Log in</button>
      </div>
    </header>

    <div id="math-overlay"></div>

    <!-- Touch screens: swipe through sketches -->
    <div id="feed" class="feed" aria-label="Sketches, swipe up for the next one"></div>
    <div id="feed-caption" class="feed-caption">
      <a class="feed-author" href="/" data-link></a>
      <span class="feed-name"></span>
      <span class="feed-meta"></span>
    </div>
    <div id="feed-actions" class="feed-actions" aria-label="Sketch tools">
      <a class="feed-btn feed-profile" href="/" data-link aria-label="Author's profile"></a>
      <button type="button" class="feed-btn" data-open="explain"></button>
      <button type="button" class="feed-btn" data-open="comments"></button>
      <button type="button" class="feed-btn" data-open="code"></button>
      <button type="button" class="feed-btn" data-open="params"></button>
      <button type="button" class="feed-btn" data-action="interact"></button>
      <button type="button" class="feed-btn" data-action="more" aria-haspopup="true"></button>
    </div>
    <button id="show-controls" class="show-controls" type="button">Show controls</button>

    <nav class="dock" id="dock" aria-label="Sketch tools">
      <button id="prev-btn" class="dock-btn dock-nav" type="button" aria-label="Previous sketch"></button>
      <button id="explain-toggle" class="dock-btn" type="button" title="What the symbols mean (E)"></button>
      <button id="params-toggle" class="dock-btn" type="button" title="Sliders"></button>
      <button id="comments-toggle" class="dock-btn" type="button" title="Comments"></button>
      <button id="code-toggle" class="dock-btn" type="button" title="Edit the code"></button>
      <button id="hide-toggle" class="dock-btn" type="button" title="Hide everything but the animation (H)"></button>
      <button id="more-toggle" class="dock-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <button id="next-btn" class="dock-btn dock-nav" type="button" aria-label="Next sketch"></button>
    </nav>

    <div id="more-menu" class="menu hidden" role="menu">
      <button id="media-toggle" type="button" role="menuitem">Music &amp; recording</button>
      <button id="audio-toggle" type="button" role="menuitem">Use microphone</button>
      <button id="view-toggle" type="button" role="menuitem">Hide controls <kbd>H</kbd></button>
      <button id="fullscreen-toggle" type="button" role="menuitem">Fullscreen <kbd>F</kbd></button>
      <button id="publish-toggle" class="menu-admin hidden" type="button" role="menuitem">Unpublish this sketch</button>
    </div>

    <div id="code-panel" class="code-panel panel panel-left hidden"></div>
    <div id="params-panel" class="params-panel panel hidden"></div>
    <div id="comments-panel" class="comments-panel panel hidden"></div>
    <div id="media-panel" class="params-panel panel hidden"></div>
    <div id="explain-panel" class="params-panel panel panel-wide hidden"></div>
    <div id="review-panel" class="params-panel panel panel-wide hidden"></div>
    <div id="picker-panel" class="panel panel-picker hidden">
      <div class="panel-head"><h2>Sketches</h2></div>
      <div id="picker-grid"></div>
    </div>

    <div id="rec-indicator" title="Recording"><span></span>REC</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
